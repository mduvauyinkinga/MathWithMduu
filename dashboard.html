<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dashboard - MathWithMDU</title>
  <meta name="description" content="Student dashboard for MathWithMDU: access lessons, past papers, and your announcements based on your plan." />
  <meta name="robots" content="index,follow" />
  <link rel="canonical" href="dashboard.html" />
  <!-- OpenGraph -->
  <meta property="og:title" content="Dashboard - MathWithMDU" />
  <meta property="og:description" content="Access lessons, past papers, and announcements in your MathWithMDU student dashboard." />
  <meta property="og:type" content="website" />
  <meta property="og:locale" content="en_US" />
  <meta property="og:site_name" content="MathWithMDU" />
  <!-- Twitter -->
  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:title" content="Dashboard - MathWithMDU" />
  <meta name="twitter:description" content="Access lessons, past papers, and announcements in your MathWithMDU student dashboard." />
  <link rel="stylesheet" href="styles.css">
  <link rel="stylesheet" href="assets/vendor/font-awesome/all.min.css" />

  <!-- Favicon + mobile icons -->
<link rel="icon" type="image/png" sizes="32x32" href="assets/logo%20-%20blu-ish.png">
<link rel="apple-touch-icon" sizes="180x180" href="assets/logo%20-%20blu-ish.png">

  <script type="module" src="dashboard.js" defer></script>
  <script type="module" src="theme.js" defer></script>
  <script src="navbar.js" defer></script>

</head>
<body class="dashboard-page">
  <nav class="navbar">
    <div class="nav-container">
      <a href="index.html" class="logo-link" aria-label="Go to home">
<img class="logo-img" src="assets/logo%20-%20blu-ish.png" alt="MathWithMDU logo"/>
      </a>
      <i class="fa-solid fa-drafting-compass mdu-icon" aria-hidden="true"></i>
      <div class="nav-wrapper">
        <ul class="nav-links" id="navLinks">
          <li><a href="index.html#home">Home</a></li>
          <li><a href="plans.html">Plans</a></li>
          <li><a href="contact.html">Contact</a></li>
          <li><a href="dashboard.html" class="active-link">Dashboard</a></li>
        </ul>
        <div class="mobile-menu">
          <ul class="nav-links">
            <li><a href="index.html#home">Home</a></li>
            <li><a href="plans.html">Plans</a></li>
            <li><a href="contact.html">Contact</a></li>
            <li><a href="dashboard.html">Dashboard</a></li>
          </ul>
        </div>
      </div>

      <div class="menu-overlay"></div>

      <div class="auth-btns">
        <div id="authSection"></div>
      </div>

    </div>
  </nav>

  <main class="mdu-page-top" style="min-height: calc(100vh - 72px);">
    <section class="container mdu-section">
      <div class="card">
        <h1 id="userInfo" class="mdu-title">Dashboard</h1>
        <p id="planBadge" class="mdu-badge mdu-badge-accent">
          Current Plan: TRIAL
        </p>
      </div>



      <div class="card-grid">
        <div class="card">
          <h2 class="mdu-subtitle">Lessons</h2>
          <div id="lessonsList"></div>
        </div>

        <div class="card">
          <h2 class="mdu-subtitle">Past Papers</h2>
          <div id="papersList"></div>
        </div>

      </div>

      <div class="card mdu-section-top">
        <h2 class="mdu-subtitle">Announcements</h2>
        <div id="announcementsList"></div>
      </div>

    </section>
  </main>

  <div id="loading" class="loading hidden" aria-hidden="true">
    <div class="spinner"></div>
  </div>

  <div id="alertContainer" aria-live="polite" aria-atomic="true"></div>
</body>
</html>
