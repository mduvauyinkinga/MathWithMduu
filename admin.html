<!-- =========================
     AUTH GATE (SAFER FLOW)
     ========================= -->
<div class="container mdu-page-top">


  <div id="authSection" class="card">
    <h1>Admin Panel</h1>
    <p>Login with admin email to access</p>
    <form id="adminLoginForm">
      <div class="form-group">
        <label for="adminEmail">Admin Email</label>
        <input type="email" id="adminEmail" placeholder="Admin Email" required />
      </div>

      <div class="form-group">
        <label for="adminPassword">Password</label>
        <input type="password" id="adminPassword" placeholder="Password" required />
      </div>

      <button id="adminLogin" class="btn btn-primary" type="button">Admin Login</button>
    </form>

    <div id="loginError" class="alert alert-error hidden" role="alert" aria-live="polite"></div>
  </div>

  <div id="adminSection" class="hidden">

    <!-- ================= LESSONS ================= -->
    <div class="card">
      <h2>Upload Lesson</h2>
      <form id="lessonForm">
        <div class="form-group">
          <label for="lessonTitle">Title</label>
          <input type="text" id="lessonTitle" required />
        </div>

        <div class="form-group">
          <label for="lessonGrade">Grade</label>
          <select id="lessonGrade" required>
            <option value="10">Grade 10</option>
            <option value="11">Grade 11</option>
            <option value="12">Grade 12</option>
          </select>
        </div>

        <div class="form-group">
          <label for="lessonTerm">Term</label>
          <input type="number" id="lessonTerm" min="1" max="4" required />
        </div>

        <div class="form-group">
          <label for="lessonWeek">Week</label>
          <input type="number" id="lessonWeek" required />
        </div>

        <div class="form-group">
          <label for="lessonTopic">Topic</label>
          <input type="text" id="lessonTopic" required />
        </div>

        <div class="form-group">
          <label for="lessonDesc">Description</label>
          <textarea id="lessonDesc" rows="3" required></textarea>
        </div>

        <div class="form-group">
          <label for="lessonURL">File URL</label>
          <input type="url" id="lessonURL" required />
        </div>

        <div class="form-group">
          <label>
            <input type="checkbox" id="lessonFree" />
            Free Access
          </label>
        </div>

        <button type="submit" class="btn btn-primary">Upload Lesson</button>
      </form>
    </div>

    <!-- ================= PAPERS ================= -->
    <div class="card">
      <h2>Upload Past Paper</h2>
      <form id="paperForm">
        <div class="form-group">
          <label for="paperTitle">Title</label>
          <input type="text" id="paperTitle" required />
        </div>

        <div class="form-group">
          <label for="paperGrade">Grade</label>
          <select id="paperGrade" required>
            <option value="10">Grade 10</option>
            <option value="11">Grade 11</option>
            <option value="12">Grade 12</option>
          </select>
        </div>

        <div class="form-group">
          <label for="paperTopic">Topic</label>
          <input type="text" id="paperTopic" required />
        </div>

        <div class="form-group">
          <label for="paperURL">File URL</label>
          <input type="url" id="paperURL" required />
        </div>

        <div class="form-group">
          <label>
            <input type="checkbox" id="paperFree" />
            Free
          </label>
        </div>

        <button type="submit" class="btn btn-primary">Upload Paper</button>
      </form>
    </div>

    <!-- ================= FILE UPLOAD ================= -->
    <div class="card">
      <h2><i class="fa-solid fa-folder-open mdu-icon"></i> File Upload</h2>
      <form id="uploadForm">
        <div class="form-group">
          <label for="fileTitle">File Title</label>
          <input type="text" id="fileTitle" required />
        </div>

        <div class="form-group">
          <label for="fileInput">Select File</label>
          <input type="file" id="fileInput" required />
        </div>

        <button type="submit" class="btn btn-primary">Upload File</button>
      </form>
    </div>

    <!-- ================= ANNOUNCEMENTS ================= -->
    <div class="card">
      <h2>Post Announcement</h2>
      <form id="announceForm">
        <div class="form-group">
          <label for="announceMsg">Message</label>
          <textarea id="announceMsg" rows="4" required></textarea>
        </div>

        <div class="form-group">
          <label for="announceGrade">Grade</label>
          <input type="text" id="announceGrade" value="all" />
        </div>

        <div class="form-group">
          <label for="announceLink">Meeting Link</label>
          <input type="url" id="announceLink" />
        </div>

        <div class="form-group">
          <label>
            <input type="checkbox" id="announceImportant" />
            Important
          </label>
        </div>

        <button type="submit" class="btn btn-primary">Post</button>
      </form>
    </div>

  </div>
</div>
